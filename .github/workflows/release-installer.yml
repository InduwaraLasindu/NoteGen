name: Windows installer and GitHub Release
on:
  push:
    branches: [main]
    paths:
      - Cargo.toml
      - rust/**
      - installer/**
      - scripts/Build-Installer.ps1
      - scripts/Test-Installer.ps1
      - scripts/Configure-AI.ps1
      - docs/INSTALLER.md
      - docs/STUDIO.md
      - .github/workflows/release-installer.yml
  workflow_dispatch:
    inputs:
      version:
        description: Installer release version
        default: '0.3.0'
        required: true
      source_run:
        description: Successful Rust verification workflow run ID (or 'latest' for latest verified run on main)
        default: 'latest'
        required: true
      source_sha:
        description: Exact verified Rust source commit (or 'latest' to match the verified run head SHA)
        default: 'latest'
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: notegen-installer
  cancel-in-progress: false
jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.payload.outputs.version }}
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_VERSION: ${{ inputs.version || '0.3.0' }}
      SOURCE_RUN: ${{ inputs.source_run || 'latest' }}
      SOURCE_SHA: ${{ inputs.source_sha || 'latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Verify and download the proven Rust build
        id: payload
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if($env:RELEASE_VERSION -notmatch '^\d+\.\d+\.\d+$'){throw 'Invalid release version'}
          if($env:SOURCE_RUN -eq 'latest' -or [string]::IsNullOrWhiteSpace($env:SOURCE_RUN)){
            $runs=(& gh api "repos/$env:GITHUB_REPOSITORY/actions/workflows/verify-and-build.yml/runs?branch=main&status=completed&per_page=10") | ConvertFrom-Json
            if($LASTEXITCODE -ne 0){throw 'Latest verified workflow lookup failed'}
            $run=$runs.workflow_runs | Where-Object {$_.conclusion -eq 'success'} | Select-Object -First 1
            if(-not $run){throw 'No completed successful verify-and-build.yml run found on main'}
            $env:SOURCE_RUN=[string]$run.id
            if($env:SOURCE_SHA -eq 'latest' -or [string]::IsNullOrWhiteSpace($env:SOURCE_SHA)){$env:SOURCE_SHA=$run.head_sha}
          } else {
            if($env:SOURCE_RUN -notmatch '^\d+$' -or $env:SOURCE_SHA -notmatch '^[a-f0-9]{40}$'){throw 'Invalid release inputs'}
            $run=(& gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:SOURCE_RUN") | ConvertFrom-Json
            if($LASTEXITCODE -ne 0){throw 'Source workflow lookup failed'}
          }
          if($run.conclusion -ne 'success' -or $run.status -ne 'completed' -or $run.head_sha -ne $env:SOURCE_SHA -or $run.path -ne '.github/workflows/verify-and-build.yml'){throw 'Source build is not the expected verified Rust workflow'}
          $artifacts=(& gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:SOURCE_RUN/artifacts") | ConvertFrom-Json
          if($LASTEXITCODE -ne 0){throw 'Artifact lookup failed'}
          $artifact=$artifacts.artifacts | Where-Object name -EQ 'NoteGen-Rust-Windows-x64' | Select-Object -First 1
          if(-not $artifact -or $artifact.expired -or -not $artifact.digest.StartsWith('sha256:')){throw 'Verified source artifact is unavailable'}
          & gh run download $env:SOURCE_RUN --repo $env:GITHUB_REPOSITORY --name NoteGen-Rust-Windows-x64 --dir build/verified-artifact
          if($LASTEXITCODE -ne 0){throw 'Verified artifact download failed'}
          $zip='build/verified-artifact/NoteGen-Rust-Windows-x64.zip'
          $expected=(Get-Content "$zip.sha256" -Raw).Trim().Split(' ')[0].ToLowerInvariant()
          $actual=(Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if($expected -notmatch '^[a-f0-9]{64}$' -or $actual -ne $expected){throw 'Portable ZIP checksum mismatch'}
          Expand-Archive $zip build/installer-payload -Force
          New-Item -ItemType Directory -Force dist/installer | Out-Null
          Copy-Item $zip,"$zip.sha256" dist/installer -Force
          $manifest=@{version=$env:RELEASE_VERSION;source_run=[long]$env:SOURCE_RUN;source_sha=$env:SOURCE_SHA;source_artifact=$artifact.id;source_artifact_digest=$artifact.digest;portable_zip_sha256=$actual;installer_source_sha=$env:GITHUB_SHA}
          $manifest | ConvertTo-Json | Set-Content build/installer-provenance.json -Encoding utf8
          "version=$env:RELEASE_VERSION" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
      - name: Install the SHA256-pinned compiler
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $download=Join-Path $env:RUNNER_TEMP 'innosetup-7.1.1-x64.exe'
          & curl.exe -fL --retry 2 --max-time 180 https://github.com/jrsoftware/issrc/releases/download/is-7_1_1/innosetup-7.1.1-x64.exe -o $download
          if($LASTEXITCODE -ne 0){throw 'Compiler download failed'}
          if((Get-FileHash $download -Algorithm SHA256).Hash.ToLowerInvariant() -ne '8a5a6711c3766a6e5fb74f280ba0e3551e719ce94538d901fdbd1f8f9920b3f0'){throw 'Compiler checksum mismatch'}
          $compilerDir=Join-Path $env:RUNNER_TEMP 'NoteGen-InnoSetup'
          $process=Start-Process $download -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-',('/DIR="{0}"' -f $compilerDir)) -PassThru -Wait
          if($process.ExitCode -ne 0 -or -not(Test-Path "$compilerDir/ISCC.exe")){throw "Compiler setup failed: $($process.ExitCode)"}
          "NOTEGEN_ISCC=$compilerDir/ISCC.exe" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Check the shipped PowerShell entry points
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          foreach($file in @('scripts/Build-Installer.ps1','scripts/Test-Installer.ps1','scripts/Configure-AI.ps1')){
            $tokens=$null;$errors=$null
            [Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file),[ref]$tokens,[ref]$errors) | Out-Null
            if($errors.Count){throw ($errors | Out-String)}
          }
      - name: Compile the installer
        shell: pwsh
        run: ./scripts/Build-Installer.ps1 -Payload ./build/installer-payload/NoteGen -Compiler $env:NOTEGEN_ISCC -Version $env:RELEASE_VERSION
      - name: Install, launch, upgrade and uninstall the actual EXE
        shell: pwsh
        run: ./scripts/Test-Installer.ps1 -Installer "./dist/installer/NoteGen-Setup-$env:RELEASE_VERSION.exe" -Version $env:RELEASE_VERSION
      - name: Seal the tested release manifest
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $manifest=Get-Content build/installer-provenance.json -Raw | ConvertFrom-Json -AsHashtable
          $exe="dist/installer/NoteGen-Setup-$env:RELEASE_VERSION.exe"
          $manifest.installer_sha256=(Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $manifest.installer_bytes=(Get-Item $exe).Length
          $manifest.app_sha256=(Get-FileHash build/installer-payload/NoteGen/NoteGen.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $manifest.validation=@(Get-Content build/installer-evidence/passed.txt)
          $manifest | ConvertTo-Json -Depth 8 | Set-Content dist/installer/installer-manifest.json -Encoding utf8
          @"
          ## NoteGen $env:RELEASE_VERSION — Studio, Handwriting Profiles, TrueType Font Export & 3rd-Party AI

          Install NoteGen $env:RELEASE_VERSION directly on Windows 10/11 x64-compatible systems.

          Download **NoteGen-Setup-$env:RELEASE_VERSION.exe** (or the portable **NoteGen-Rust-Windows-x64.zip**) below.
          Installation is per user and does not require administrator rights. Start menu
          shortcuts and an optional desktop shortcut are included. Uninstall from Windows
          Settings; user models, writer profiles, and document projects are preserved.

          ### What's New in NoteGen $env:RELEASE_VERSION
          - **NoteGen Studio (`Context & Writers`)**: Unified studio for document subject/glossary guidance, interactive clarification questions, writer handwriting profiles, personal TrueType (`.ttf`) font pack export, 3rd-party AI model registration, and public Wikipedia/search grounding.
          - **Interactive Clarification Inbox ("A little help with this page")**: Prompts for unrecognizable words, conflicting numbers/table cells, and diagram interpretations with zoomed page crops, one-click reader alternatives, and contextual AI re-reading.
          - **Writer Handwriting Profiles & Personal TrueType (`.ttf`) Font Pack Export**: Learn individual writers' English letter/word patterns across pages, attach confirmed glyph reference sheets to vision models, average up to 32 samples per character, and export an installable `.ttf` font + SVG glyphs.
          - **3rd-Party AI Models & SHA256 Publisher Updates**: Register local GGUF + projector pairs or loopback OpenAI-compatible vision servers (`LM Studio`, `Ollama`, `vLLM`), and check/apply SHA256-verified publisher updates with one-click rollback.
          - **Audit & Stability Fixes**: Fixed 4-edge perimeter dark-background guard on tight glyph crops (`writers.rs`), trailing sentence punctuation normalization in numeric consensus (`consensus.rs`), and digest-aware clarification re-prompting (`assistance.rs`).

          ### Local AI & Verification
          English printed OCR and Word export work immediately. For local AI, choose
          **NoteGen → Set up local AI** in the Start menu. Runtime and model downloads are
          selected for available RAM/VRAM and verified with SHA256 before use.

          The executable payload is the verified Rust build from run $env:SOURCE_RUN
          at commit $env:SOURCE_SHA.
          [Installer Guide](https://github.com/InduwaraLasindu/NoteGen/blob/main/docs/INSTALLER.md) · [NoteGen Studio Guide](https://github.com/InduwaraLasindu/NoteGen/blob/main/docs/STUDIO.md)
          "@ | Set-Content dist/installer/release-notes.md -Encoding utf8
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: NoteGen-Windows-Installer-${{ steps.payload.outputs.version }}
          path: dist/installer/*
          retention-days: 30
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: Installer-validation-evidence
          path: build/installer-evidence/*
          if-no-files-found: ignore
          retention-days: 30
  publish:
    needs: installer
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_VERSION: ${{ needs.installer.outputs.version }}
    steps:
      - name: Download only the tested installer assets
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "NoteGen-Windows-Installer-$RELEASE_VERSION" --dir dist
      - name: Verify installer hash and publish a GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum --check "NoteGen-Setup-$RELEASE_VERSION.exe.sha256"
          sha256sum --check "NoteGen-Rust-Windows-x64.zip.sha256"
          tag="v$RELEASE_VERSION"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'This release version already exists; use a new version instead of replacing published binaries.'
            exit 1
          fi
          gh release create "$tag" "NoteGen-Setup-$RELEASE_VERSION.exe" "NoteGen-Setup-$RELEASE_VERSION.exe.sha256" "NoteGen-Rust-Windows-x64.zip" "NoteGen-Rust-Windows-x64.zip.sha256" installer-manifest.json --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "NoteGen $RELEASE_VERSION — Studio, Handwriting Profiles & Windows Installer" --notes-file release-notes.md --draft
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --latest
