name: Rust verification and Windows executable
on:
  push:
    branches: [main]
    paths: ['Cargo.toml', 'Cargo.lock', 'rust/**', 'scripts/**', '.github/workflows/verify-and-build.yml']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: notegen-rust-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      NOTEGEN_FIXTURE_DIR: build/native-fixture
      NOTEGEN_FONT_EVIDENCE: build/font-evidence
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install pinned Rust
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - run: rustup default 1.99.1
      - name: Native dependencies (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr fonts-dejavu-core libfontconfig1-dev libegl1 libgl1-mesa-dri libxkbcommon0 libxkbcommon-x11-0 xvfb
          mkdir -p build/pdfium-rust
          curl -fL --retry 2 https://github.com/bblanchon/pdfium-binaries/releases/download/chromium/8125/pdfium-linux-x64.tgz -o build/pdfium-rust/pdfium.tgz
          tar -xzf build/pdfium-rust/pdfium.tgz -C build/pdfium-rust
          echo "NOTEGEN_PDFIUM=$GITHUB_WORKSPACE/build/pdfium-rust/lib/libpdfium.so" >> "$GITHUB_ENV"
      - name: Native dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install tesseract --yes --no-progress
          if ($LASTEXITCODE -ne 0) {throw 'Tesseract installation failed'}
          'C:\Program Files\Tesseract-OCR' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          New-Item -ItemType Directory -Force build/pdfium-rust | Out-Null
          curl.exe -fL --retry 2 https://github.com/bblanchon/pdfium-binaries/releases/download/chromium/8125/pdfium-win-x64.tgz -o build/pdfium-rust/pdfium.tgz
          if ($LASTEXITCODE -ne 0) {throw 'PDFium download failed'}
          tar -xzf build/pdfium-rust/pdfium.tgz -C build/pdfium-rust
          "NOTEGEN_PDFIUM=$env:GITHUB_WORKSPACE/build/pdfium-rust/bin/pdfium.dll" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        id: rust-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: notegen-compact-v2-${{ runner.os }}-1.99.1-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'rust/**') }}
          restore-keys: notegen-compact-v2-${{ runner.os }}-1.99.1-
      - run: cargo fmt --all --check
        id: format
      - run: cargo clippy --locked --all-features --all-targets --keep-going -j 2 -- -D warnings
        id: static_checks
      - name: Review window interaction and viewport acceptance
        id: review_layout
        run: 'cargo test --locked --all-features --lib desktop::acceptance:: -j 2'
      - name: All Rust tests and real raster-PDF OCR
        id: first_tests
        if: ${{ !cancelled() && steps.format.outcome == 'success' && steps.static_checks.outcome == 'success' }}
        run: cargo test --locked --all-features --all-targets --no-fail-fast -j 2
      - name: Repeat the complete suite with serial test execution
        if: ${{ !cancelled() && steps.format.outcome == 'success' && steps.static_checks.outcome == 'success' && steps.first_tests.outcome != 'skipped' }}
        env:
          RUST_TEST_THREADS: '1'
        run: cargo test --locked --all-features --all-targets --no-fail-fast -j 2
      - name: Diagnose native Windows PDF failures serially
        id: pdf_serial
        if: ${{ !cancelled() && runner.os == 'Windows' && steps.first_tests.outcome == 'failure' }}
        shell: pwsh
        run: cargo test --locked --all-features --test searchable_pdf -j 2 -- --test-threads=1 --nocapture
      - name: Isolate a failing native PDF case in a fresh process
        if: ${{ !cancelled() && runner.os == 'Windows' && steps.pdf_serial.outcome == 'failure' }}
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $cases=@(cargo test --locked --all-features --test searchable_pdf -j 2 -- --list | Where-Object {$_ -match ': test$'} | ForEach-Object {$_ -replace ': test$',''})
          if($LASTEXITCODE -ne 0 -or $cases.Count -eq 0){throw 'Could not enumerate native PDF tests'}
          $failed=@()
          foreach($case in $cases){
            Write-Host "[Native PDF isolation] $case"
            cargo test --locked --all-features --test searchable_pdf -j 2 -- $case --exact --test-threads=1 --nocapture
            if($LASTEXITCODE -ne 0){$failed+=$case}
          }
          if($failed.Count){throw "Native PDF cases failed: $($failed -join ', ')"}
      - name: Native Windows TrueType installation and rendering
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/Test-Font.ps1
      - name: Native Windows credential store synthetic round-trip
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach($pass in 1..2){
            cargo test --locked --all-features --lib credentials::windows_tests::isolated_native_store_round_trip_and_cleanup -- --ignored --exact
            if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          }
      - name: Actual native desktop and review screenshots
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cargo build --locked --features desktop --bins --example ui_capture -j 2
          target/debug/notegen-cli defaults -o build/qa-settings.json
          python3 - <<'PY'
          import json,os
          p='build/qa-settings.json'
          s=json.load(open(p))
          s.update(pdfium=os.environ['NOTEGEN_PDFIUM'],preset='fast',dpi=150,auto_rotate=False)
          with open(p,'w') as f:json.dump(s,f)
          PY
          target/debug/notegen-cli --settings build/qa-settings.json convert build/native-fixture/scan.pdf --preset fast -o build/qa.docx > build/qa-cli.log
          project=$(python3 - <<'PY'
          import json,pathlib
          entries=[line.removeprefix('Project: ') for line in pathlib.Path('build/qa-cli.log').read_text().splitlines() if line.startswith('Project: ')]
          assert len(entries)==1, 'Expected one exact project path from the successful conversion'
          project=pathlib.Path(entries[0]).resolve(strict=True)
          manifest=json.loads((project/'project.json').read_text())
          assert manifest['pages'], 'Converted project has no active pages'
          for page in manifest['pages']:
              assert (project/f'page-{page:05}.json').is_file(), 'Converted page checkpoint is missing'
              assert (project/f'page-{page:05}.png').is_file(), 'Converted source raster is missing'
          pathlib.Path('build/qa-project-path.txt').write_text(str(project))
          print(project)
          PY
          )
          target/debug/notegen-cli inspect "$project" > build/qa-project-inspect.json
          mkdir -p docs/images
          xvfb-run -a target/debug/examples/ui_capture docs/images/rust-workspace.png workspace
          xvfb-run -a target/debug/examples/ui_capture docs/images/rust-advanced.png advanced
          xvfb-run -a target/debug/examples/ui_capture docs/images/rust-review.png review "$project"
          xvfb-run -a target/debug/examples/ui_capture docs/images/rust-studio.png studio
          xvfb-run -a target/debug/examples/ui_capture docs/images/rust-writers.png writers
          xvfb-run -a target/debug/examples/ui_capture docs/images/rust-models.png models
          xvfb-run -a target/debug/examples/ui_capture docs/images/rust-settings.png settings
          xvfb-run -a target/debug/examples/ui_capture docs/images/rust-updates.png updates
          xvfb-run -a target/debug/examples/ui_capture docs/images/rust-hardware.png hardware
          xvfb-run -a target/debug/examples/ui_capture docs/images/rust-projects.png workbench-projects "$project"
          xvfb-run -a target/debug/examples/ui_capture docs/images/rust-exports.png workbench-export "$project"
          xvfb-run -a target/debug/examples/ui_capture docs/images/rust-recovery.png workbench-recovery "$project"
          xvfb-run -a target/debug/examples/ui_capture docs/images/rust-privacy.png workbench-privacy "$project"
      - name: Verify Windows AI runtime installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/Setup-Runtime.ps1 -Backend CPU
      - name: Release Windows executables
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/Build-Reproducible.ps1
      - name: Package and test actual scanned-PDF conversion
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/Build-Windows.ps1 -SkipBuild
      - name: Start desktop from extracted portable ZIP
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Expand-Archive ./dist/NoteGen-Rust-Windows-x64.zip ./build/package-smoke -Force
          $state=Join-Path (Get-Location).Path 'build/package-ui-state'
          $process=Start-Process ./build/package-smoke/NoteGen/NoteGen.exe -ArgumentList @('--data-dir',('"{0}"' -f $state)) -WindowStyle Hidden -PassThru
          Start-Sleep -Seconds 8
          if ($process.HasExited) {throw "Desktop exited: $($process.ExitCode)"}
          Stop-Process -Id $process.Id
      - name: Real Windows OCR, vision and Maximum Accuracy inference
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/Smoke-AI.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: runner.os == 'Windows'
        with:
          name: NoteGen-Rust-Windows-x64
          path: |
            dist/NoteGen-Rust-Windows-x64.zip
            dist/NoteGen-Rust-Windows-x64.zip.sha256
          retention-days: 30
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: ${{ !cancelled() && runner.os == 'Linux' && steps.first_tests.outcome == 'success' }}
        with:
          name: Rust-native-validation-evidence
          path: |
            docs/images/rust-*.png
            build/qa.docx
            build/qa-cli.log
            build/qa-project-path.txt
            build/qa-project-inspect.json
            build/font-evidence/*
          retention-days: 30
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: runner.os == 'Windows'
        with:
          name: Windows-font-evidence
          path: build/font-evidence/*
          retention-days: 30
      - uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        timeout-minutes: 5
        continue-on-error: true
        # Keep compiled dependencies for the next regression run. Failed checks still fail the job.
        if: ${{ !cancelled() && steps.format.outcome == 'success' && steps.static_checks.outcome == 'success' && steps.rust-cache.outputs.cache-hit != 'true' }}
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: notegen-compact-v2-${{ runner.os }}-1.99.1-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'rust/**') }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always() && runner.os == 'Windows'
        with:
          name: Native-AI-model-evidence
          path: |
            build/ai-smoke/NoteGen/results/**/*.json
            build/ai-smoke/NoteGen/results/**/*.jsonl
            build/ai-smoke/NoteGen/results/**/*.log
            build/ai-smoke/NoteGen/results/**/*.txt
            build/ai-smoke/NoteGen/maximum-smoke.docx
          if-no-files-found: ignore
          retention-days: 30
  reproducibility:
    name: Independent Windows executable build
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install pinned Rust
        run: rustup toolchain install 1.99.1 --profile minimal
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: NoteGen-Rust-Windows-x64
          path: build/reference
      - name: Exercise comparison failure contracts twice
        shell: pwsh
        run: |
          ./scripts/Test-Reproducibility.ps1
          ./scripts/Test-Reproducibility.ps1
      - name: Compile independently without target artifacts
        shell: pwsh
        run: |
          if(Test-Path build/reproduction-target){throw 'Independent target must start empty'}
          ./scripts/Build-Reproducible.ps1 -TargetDirectory build/reproduction-target
      - name: Compare actual executable bytes and source recipe
        shell: pwsh
        run: |
          $source=(& git rev-parse HEAD).Trim()
          if($LASTEXITCODE -ne 0){throw 'Cannot identify checked-out source'}
          ./scripts/Compare-Reproducible.ps1 -ReferenceArchive build/reference/NoteGen-Rust-Windows-x64.zip -CandidateDirectory build/reproduction-target/release -SourceCommit $source
          $comparison=Get-Content build/reproducibility.json -Raw | ConvertFrom-Json
          if(-not $comparison.independent_jobs){throw 'Independent producer jobs were not established by the build records'}
          $support=if('${{ github.event.repository.visibility }}' -eq 'public' -or '${{ vars.ENABLE_PRIVATE_ATTESTATIONS }}' -eq 'true'){'configured'}else{'not-configured-for-private-repository'}
          @{schema=1;native_attestation=$support;note='GitHub private/internal artifact attestations require Enterprise Cloud. Unsupported service is never represented as a signed attestation.'} | ConvertTo-Json | Set-Content build/attestation-support.json -Encoding utf8NoBOM
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: Windows-reproducibility-evidence
          path: |
            build/reproducibility.json
            build/attestation-support.json
          retention-days: 30
  attest:
    name: Attest verified release artifacts
    needs: reproducibility
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && (github.event.repository.visibility == 'public' || vars.ENABLE_PRIVATE_ATTESTATIONS == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: NoteGen-Rust-Windows-x64
          path: artifacts
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: Windows-reproducibility-evidence
          path: evidence
      - name: Generate native build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: |
            artifacts/NoteGen-Rust-Windows-x64.zip
            evidence/reproducibility.json
