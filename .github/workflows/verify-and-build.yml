name: Verify and build Windows

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', 'README.md', 'CONTRIBUTING.md', 'THIRD_PARTY_NOTICES.md']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Tesseract on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr libegl1 libopengl0 libgl1 libxkbcommon0 fonts-dejavu-core
      - name: Install Tesseract on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install tesseract --yes --no-progress
          'C:\Program Files\Tesseract-OCR' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - run: python -m pip install -r requirements-dev-lock.txt
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: python -m ruff check src tests scripts
      - run: python -m ruff format --check src tests scripts
      - name: Run tests with real Tesseract
        run: python -m pytest -q -rA --junitxml=test-results.xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: tests-${{ matrix.os }}
          path: test-results.xml
          retention-days: 30
  windows-build:
    name: Portable Windows app
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev-lock.txt
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - shell: pwsh
        run: .\scripts\Build-Windows.ps1
      - name: Smoke-test packaged CLI
        run: .\dist\NoteGen\CLI\NoteGenCLI.exe --version
      - name: Smoke-test packaged Word export
        run: python scripts/smoke_package.py dist/NoteGen/CLI/NoteGenCLI.exe
      - name: Smoke-test packaged desktop startup
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = 'offscreen'
          $process = Start-Process .\dist\NoteGen\NoteGen.exe -PassThru
          Start-Sleep -Seconds 8
          if ($process.HasExited) { throw "Desktop exited unexpectedly: $($process.ExitCode)" }
          Stop-Process -Id $process.Id
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: NoteGen-Windows-x64
          path: dist/NoteGen-Windows-x64.zip
          retention-days: 30
