name: Rust verification and Windows executable
on:
  push:
    branches: [main]
    paths: ['Cargo.toml', 'Cargo.lock', 'rust/**', 'scripts/Build-Windows.ps1', 'scripts/Setup-Runtime.ps1', 'scripts/Install-Models.ps1', 'scripts/Smoke-AI.ps1', 'scripts/Test-Font.ps1', '.github/workflows/verify-and-build.yml']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: notegen-rust-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      NOTEGEN_FIXTURE_DIR: build/native-fixture
      NOTEGEN_FONT_EVIDENCE: build/font-evidence
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install pinned Rust
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - run: rustup default 1.99.1
      - name: Native dependencies (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr fonts-dejavu-core libfontconfig1-dev libegl1 libgl1-mesa-dri libxkbcommon0 libxkbcommon-x11-0 xvfb
          mkdir -p build/pdfium-rust
          curl -fL --retry 2 https://github.com/bblanchon/pdfium-binaries/releases/download/chromium/8125/pdfium-linux-x64.tgz -o build/pdfium-rust/pdfium.tgz
          tar -xzf build/pdfium-rust/pdfium.tgz -C build/pdfium-rust
          echo "NOTEGEN_PDFIUM=$GITHUB_WORKSPACE/build/pdfium-rust/lib/libpdfium.so" >> "$GITHUB_ENV"
      - name: Native dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install tesseract --yes --no-progress
          if ($LASTEXITCODE -ne 0) {throw 'Tesseract installation failed'}
          'C:\Program Files\Tesseract-OCR' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          New-Item -ItemType Directory -Force build/pdfium-rust | Out-Null
          curl.exe -fL --retry 2 https://github.com/bblanchon/pdfium-binaries/releases/download/chromium/8125/pdfium-win-x64.tgz -o build/pdfium-rust/pdfium.tgz
          if ($LASTEXITCODE -ne 0) {throw 'PDFium download failed'}
          tar -xzf build/pdfium-rust/pdfium.tgz -C build/pdfium-rust
          "NOTEGEN_PDFIUM=$env:GITHUB_WORKSPACE/build/pdfium-rust/bin/pdfium.dll" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        id: rust-cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: notegen-compact-v2-${{ runner.os }}-1.99.1-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'rust/**') }}
          restore-keys: notegen-compact-v2-${{ runner.os }}-1.99.1-
      - run: cargo fmt --all --check
        id: format
      - run: cargo clippy --locked --all-features --all-targets -j 2 -- -D warnings
      - name: All Rust tests and real raster-PDF OCR
        id: first_tests
        if: ${{ !cancelled() && steps.format.outcome == 'success' }}
        run: cargo test --locked --all-features --all-targets -j 2
      - name: Repeat the complete suite with serial test execution
        if: ${{ !cancelled() && steps.first_tests.outcome == 'success' }}
        env:
          RUST_TEST_THREADS: '1'
        run: cargo test --locked --all-features --all-targets -j 2
      - name: Native Windows TrueType installation and rendering
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/Test-Font.ps1
      - name: Native Windows credential store synthetic round-trip
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach($pass in 1..2){
            cargo test --locked --all-features --lib credentials::windows_tests::isolated_native_store_round_trip_and_cleanup -- --ignored --exact
            if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          }
      - name: Actual native desktop and review screenshots
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cargo build --locked --features desktop --bins --example ui_capture -j 2
          target/debug/notegen-cli defaults -o build/qa-settings.json
          python3 - <<'PY'
          import json,os
          p='build/qa-settings.json'
          s=json.load(open(p))
          s.update(pdfium=os.environ['NOTEGEN_PDFIUM'],preset='fast',dpi=150,auto_rotate=False)
          with open(p,'w') as f:json.dump(s,f)
          PY
          target/debug/notegen-cli --settings build/qa-settings.json convert build/native-fixture/scan.pdf --preset fast -o build/qa.docx > build/qa-cli.log
          project="$(dirname "$(find build/.notegen -name project.json -print -quit)")"
          mkdir -p docs/images
          xvfb-run -a target/debug/examples/ui_capture docs/images/rust-workspace.png workspace
          xvfb-run -a target/debug/examples/ui_capture docs/images/rust-advanced.png advanced
          xvfb-run -a target/debug/examples/ui_capture docs/images/rust-review.png review "$project"
          xvfb-run -a target/debug/examples/ui_capture docs/images/rust-studio.png studio
          xvfb-run -a target/debug/examples/ui_capture docs/images/rust-writers.png writers
          xvfb-run -a target/debug/examples/ui_capture docs/images/rust-models.png models
          xvfb-run -a target/debug/examples/ui_capture docs/images/rust-settings.png settings
          xvfb-run -a target/debug/examples/ui_capture docs/images/rust-updates.png updates
          xvfb-run -a target/debug/examples/ui_capture docs/images/rust-hardware.png hardware
          xvfb-run -a target/debug/examples/ui_capture docs/images/rust-projects.png workbench-projects "$project"
          xvfb-run -a target/debug/examples/ui_capture docs/images/rust-exports.png workbench-export "$project"
          xvfb-run -a target/debug/examples/ui_capture docs/images/rust-recovery.png workbench-recovery "$project"
          xvfb-run -a target/debug/examples/ui_capture docs/images/rust-privacy.png workbench-privacy "$project"
      - name: Verify Windows AI runtime installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/Setup-Runtime.ps1 -Backend CPU
      - name: Release Windows executables
        if: runner.os == 'Windows'
        run: cargo build --locked --release --features desktop --bins -j 2
      - name: Package and test actual scanned-PDF conversion
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/Build-Windows.ps1 -SkipBuild
      - name: Start desktop from extracted portable ZIP
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Expand-Archive ./dist/NoteGen-Rust-Windows-x64.zip ./build/package-smoke -Force
          $process=Start-Process ./build/package-smoke/NoteGen/NoteGen.exe -PassThru
          Start-Sleep -Seconds 8
          if ($process.HasExited) {throw "Desktop exited: $($process.ExitCode)"}
          Stop-Process -Id $process.Id
      - name: Real Windows OCR, vision and Maximum Accuracy inference
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/Smoke-AI.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: runner.os == 'Windows'
        with:
          name: NoteGen-Rust-Windows-x64
          path: |
            dist/NoteGen-Rust-Windows-x64.zip
            dist/NoteGen-Rust-Windows-x64.zip.sha256
          retention-days: 30
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: runner.os == 'Linux'
        with:
          name: Rust-native-validation-evidence
          path: |
            docs/images/rust-*.png
            build/qa.docx
            build/qa-cli.log
            build/font-evidence/*
          retention-days: 30
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: runner.os == 'Windows'
        with:
          name: Windows-font-evidence
          path: build/font-evidence/*
          retention-days: 30
      - uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        if: success() && steps.rust-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: notegen-compact-v2-${{ runner.os }}-1.99.1-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'rust/**') }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always() && runner.os == 'Windows'
        with:
          name: Native-AI-model-evidence
          path: |
            build/ai-smoke/NoteGen/results/**/*.json
            build/ai-smoke/NoteGen/results/**/*.log
            build/ai-smoke/NoteGen/results/**/*.txt
            build/ai-smoke/NoteGen/maximum-smoke.docx
          if-no-files-found: ignore
          retention-days: 30

