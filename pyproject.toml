[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "notegen"
version = "0.1.0"
description = "Offline Windows scanned PDF to editable Word with local vision AI"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
dependencies = [
  "PySide6-Essentials>=6.8,<7", "pypdfium2>=4.30,<6",
  "Pillow>=11,<13", "opencv-python-headless>=4.10,<6", "numpy>=2,<3",
  "python-docx>=1.1,<2", "pydantic>=2.10,<3", "httpx>=0.28,<0.29", "psutil>=6,<8",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-qt>=4.4,<5", "ruff>=0.14,<1", "pyinstaller>=6.11,<7"]

[project.scripts]
notegen = "notegen.cli:main"

[project.gui-scripts]
notegen-gui = "notegen.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["ocr: invokes real installed Tesseract", "gpu: requires local CUDA vision model"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
