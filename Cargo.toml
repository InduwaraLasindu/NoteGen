[package]
name = "notegen"
version = "0.4.1"
edition = "2024"
rust-version = "1.95"
license = "MIT"
description = "Adaptive local document recognition and editable Word export"

[lib]
path = "rust/src/lib.rs"

[[bin]]
name = "NoteGen"
path = "rust/src/main.rs"
required-features = ["desktop"]

[[bin]]
name = "notegen-cli"
path = "rust/src/bin/cli.rs"

[features]
default = []
desktop = ["dep:eframe", "dep:rfd"]

[[test]]
name = "core"
path = "rust/tests/core.rs"

[[test]]
name = "engine"
path = "rust/tests/engine.rs"

[dev-dependencies]
imageproc = { version = "0.25", default-features = false }
ttf-parser = "0.25"

[dependencies]
ab_glyph = "0.2"
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
sysinfo = "0.37"
csv = "1"
strsim = "0.11"
unicode-normalization = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
tempfile = "3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
tiff = "0.11.3"
rayon = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls-native-roots"] }
tokio = { version = "1", features = ["rt", "time", "macros"] }
base64 = "0.22"
regex = "1"
zip = { version = "4", default-features = false, features = ["deflate"] }
roxmltree = "0.21"
scraper = "0.24"
pdfium-render = { version = "0.9.4", default-features = false, features = ["pdfium_latest", "image_025", "thread_safe"] }
clap = { version = "4", features = ["derive"] }
eframe = { version = "0.37", optional = true, default-features = false, features = ["default_fonts", "glow", "wgpu", "x11", "wayland", "persistence", "system_fonts", "links", "clipboard"] }
rfd = { version = "0.15", optional = true, default-features = false, features = ["xdg-portal", "async-std"] }

# Keep CI and local development within modest disk budgets. Assertions and
# overflow checks remain enabled; production optimization is unchanged.
[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[lints.rust]
unsafe_code = "forbid"

[[test]]
name = "desktop"
path = "rust/tests/desktop.rs"
required-features = ["desktop"]

[[example]]
name = "ui_capture"
path = "rust/examples/ui_capture.rs"
required-features = ["desktop"]

[[test]]
name = "motion"
path = "rust/tests/motion.rs"

[[test]]
name = "studio"
path = "rust/tests/studio.rs"

[[test]]
name = "experience"
path = "rust/tests/experience.rs"

[[test]]
name = "evaluation"
path = "rust/tests/evaluation.rs"

[[test]]
name = "exports"
path = "rust/tests/exports.rs"

[[test]]
name = "review"
path = "rust/tests/review.rs"

[[test]]
name = "inputs"
path = "rust/tests/inputs.rs"

[[test]]
name = "projects"
path = "rust/tests/projects.rs"

[[test]]
name = "profile_tools"
path = "rust/tests/profile_tools.rs"

[[test]]
name = "bundles"
path = "rust/tests/bundles.rs"

[[test]]
name = "resources"
path = "rust/tests/resources.rs"

[[test]]
name = "roundtrip"
path = "rust/tests/roundtrip.rs"

[[test]]
name = "scan_tools"
path = "rust/tests/scan_tools.rs"

[[test]]
name = "context_history"
path = "rust/tests/context_history.rs"

