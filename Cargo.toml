[package]
name = "notegen"
version = "0.5.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
description = "Adaptive local document recognition and editable Word export"

[lib]
path = "rust/src/lib.rs"

[[bin]]
name = "NoteGen"
path = "rust/src/main.rs"
required-features = ["desktop"]

[[bin]]
name = "notegen-cli"
path = "rust/src/bin/cli.rs"

[features]
default = []
desktop = ["dep:eframe", "dep:rfd"]

[[test]]
name = "core"
path = "rust/tests/core.rs"

[[test]]
name = "engine"
path = "rust/tests/engine.rs"

[dev-dependencies]
imageproc = { version = "0.25", default-features = false }
harfrust = "=0.12.0"

[dependencies]
age = { version = "=0.12.1", default-features = false }
# age embeds translations through rust-embed; cached assets must not retain an
# earlier SOURCE_DATE_EPOCH in their created/modified metadata.
rust-embed = { version = "=8.13.0", default-features = false, features = ["deterministic-timestamps"] }
ttf-parser = "0.25"
ab_glyph = "0.2"
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "=1.0.28"
sha2 = "0.10"
hex = "0.4"
getrandom = "=0.4.3"
zeroize = "=1.9.1"
sysinfo = "0.37"
csv = "1"
strsim = "0.11"
unicode-normalization = "0.1"
unicode-segmentation = "=1.13.3"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
tempfile = "3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
tiff = "0.11.3"
rayon = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls-native-roots"] }
tokio = { version = "1", features = ["rt", "time", "macros"] }
base64 = "0.22"
regex = "1"
zip = { version = "4", default-features = false, features = ["deflate"] }
roxmltree = "0.21"
scraper = "0.24"
pdfium-render = { version = "=0.9.5", default-features = false, features = ["pdfium_latest", "image_025", "thread_safe"] }
clap = { version = "4", features = ["derive"] }
eframe = { version = "0.37", optional = true, default-features = false, features = ["accesskit", "default_fonts", "glow", "wgpu", "x11", "wayland", "persistence", "system_fonts", "links", "clipboard"] }
rfd = { version = "0.15", optional = true, default-features = false, features = ["xdg-portal", "async-std"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["windows-native"] }

# Keep CI and local development within modest disk budgets. Assertions and
# overflow checks remain enabled; production optimization is unchanged.
[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[lints.rust]
unsafe_code = "forbid"

[[test]]
name = "desktop"
path = "rust/tests/desktop.rs"
required-features = ["desktop"]

